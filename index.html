<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Circuit Sathi</title>
<style>
  :root{--paper:#f6f7f2;--grid:#dfe5da;--ink:#16243a;--mute:#5b6b7f;--accent:#c4410c;--ok:#1d7a46;--bad:#b3261e;--card:#fff}
  @media (prefers-color-scheme:dark){:root{--paper:#111a26;--grid:#1d2a3a;--ink:#e8edf3;--mute:#93a3b6;--accent:#ff8a4c;--ok:#5ad08b;--bad:#ff8077;--card:#18243a}}
  *{box-sizing:border-box}
  body{margin:0;font:16px/1.6 Georgia,"Times New Roman",serif;color:var(--ink);background:var(--paper);
    background-image:linear-gradient(var(--grid) 1px,transparent 1px),linear-gradient(90deg,var(--grid) 1px,transparent 1px);background-size:24px 24px}
  main{max-width:720px;margin:0 auto;padding:32px 18px 64px}
  h1{font-size:2.2rem;margin:0 0 4px;letter-spacing:-.5px}
  .sub{color:var(--mute);margin:0 0 24px}
  label{display:block;font-weight:bold;margin:16px 0 6px}
  textarea,select{width:100%;font:inherit;color:var(--ink);background:var(--card);border:2px solid var(--ink);border-radius:4px;padding:10px}
  textarea{min-height:180px;resize:vertical}
  .row{display:flex;gap:12px;align-items:end;margin-top:12px;flex-wrap:wrap}
  .row>div{flex:0 0 130px}
  button{font:inherit;font-weight:bold;cursor:pointer;border:2px solid var(--ink);border-radius:4px;padding:10px 20px;background:var(--accent);color:#fff}
  button:disabled{opacity:.6;cursor:wait}
  button:focus-visible,textarea:focus-visible,select:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
  #status{margin:16px 0;color:var(--mute)}
  #status.err{color:var(--bad)}
  .q{background:var(--card);border:2px solid var(--ink);border-radius:4px;padding:14px 16px;margin:14px 0}
  .q p{margin:0 0 10px;font-weight:bold}
  .opt{display:block;width:100%;text-align:left;background:transparent;color:var(--ink);font-weight:normal;margin:6px 0;padding:8px 12px;border-width:1px}
  .opt:hover:not(:disabled){border-color:var(--accent)}
  .opt.ok{border-color:var(--ok);border-width:2px;color:var(--ok)}
  .opt.bad{border-color:var(--bad);border-width:2px;color:var(--bad)}
  .why{margin-top:8px;color:var(--mute);font-size:.95rem}
  #score{font-weight:bold}
  pre{white-space:pre-wrap;background:var(--card);border:1px solid var(--grid);padding:10px}
</style>
</head>
<body>
<main>
  <h1>Circuit Sathi</h1>
  <p class="sub">Paste your electronics notes. Get practice MCQs. Runs on your laptop with an open model, no internet needed.</p>

  <label for="notes">Your notes</label>
  <textarea id="notes" placeholder="Example: A diode conducts when forward biased. The knee voltage of silicon is about 0.7 V..."></textarea>

  <div class="row">
    <div>
      <label for="count" style="margin-top:0">Questions</label>
      <select id="count"><option>3</option><option selected>5</option><option>8</option></select>
    </div>
    <button id="go">Make questions</button>
  </div>

  <div id="status"></div>
  <div id="score"></div>
  <div id="out"></div>
</main>

<script>
const BASE = "http://localhost:1234/v1";
const $ = id => document.getElementById(id);
let answered = 0, correct = 0, total = 0;

function setStatus(msg, isErr){ const s=$("status"); s.textContent=msg; s.className=isErr?"err":""; }

function extractJSON(text){
  const cleaned = text.replace(/```json|```/gi,"").trim();
  const start = cleaned.indexOf("["), end = cleaned.lastIndexOf("]");
  if(start<0||end<0) throw new Error("No JSON found");
  return JSON.parse(cleaned.slice(start,end+1));
}

async function generate(){
  const notes = $("notes").value.trim();
  if(!notes){ setStatus("Paste some notes first.", true); return; }
  const n = $("count").value;
  $("go").disabled = true; $("out").innerHTML=""; $("score").textContent="";
  answered=0; correct=0;
  setStatus("Thinking... small models on a laptop can take a minute.");
  try{
    const m = await fetch(BASE+"/models").then(r=>r.json());
    const model = m.data && m.data[0] && m.data[0].id;
    if(!model) throw new Error("No model loaded in LM Studio.");
    const prompt = `Read these electronics notes and write ${n} multiple-choice questions based ONLY on them.
Reply with ONLY a JSON array, no other text. Each item must look like:
{"q":"question text","options":["A","B","C","D"],"answer":0,"why":"one short reason"}
"answer" is the index (0-3) of the correct option.

NOTES:
${notes}`;
    const res = await fetch(BASE+"/chat/completions",{
      method:"POST", headers:{"Content-Type":"application/json"},
      body: JSON.stringify({model, temperature:0.4, messages:[{role:"user",content:prompt}]})
    });
    if(!res.ok) throw new Error("Server replied "+res.status);
    const data = await res.json();
    const text = data.choices[0].message.content;
    let qs;
    try{ qs = extractJSON(text); }
    catch(e){
      setStatus("The model did not return clean JSON. Try again, or use a bigger model. Raw reply below:", true);
      $("out").innerHTML = "<pre></pre>"; $("out").firstChild.textContent = text; return;
    }
    render(qs); setStatus("");
  }catch(e){
    setStatus("Could not reach LM Studio. Open LM Studio > Developer tab, load a model, start the server, and turn on 'Enable CORS'. ("+e.message+")", true);
  }finally{ $("go").disabled=false; }
}

function render(qs){
  total = qs.length;
  const out = $("out"); out.innerHTML="";
  qs.forEach((item,qi)=>{
    const box = document.createElement("div"); box.className="q";
    const p = document.createElement("p"); p.textContent=(qi+1)+". "+item.q; box.appendChild(p);
    const btns = [];
    item.options.forEach((o,oi)=>{
      const b = document.createElement("button"); b.className="opt"; b.textContent=o;
      b.onclick = ()=>{
        btns.forEach(x=>x.disabled=true);
        const ans = parseInt(item.answer);
        if(btns[ans]) btns[ans].classList.add("ok");
        if(oi===ans){ correct++; } else { b.classList.add("bad"); }
        answered++;
        const why = document.createElement("div"); why.className="why"; why.textContent=item.why||""; box.appendChild(why);
        $("score").textContent = "Score: "+correct+" / "+answered+" (of "+total+")";
      };
      btns.push(b); box.appendChild(b);
    });
    out.appendChild(box);
  });
}
$("go").onclick = generate;
</script>
</body>
</html>
